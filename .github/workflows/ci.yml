name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gymtrainer
          POSTGRES_USER: gymtrainer
          POSTGRES_PASSWORD: gymtrainer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gymtrainer"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://gymtrainer:gymtrainer@localhost:5432/gymtrainer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python and the locked dependencies
        run: |
          uv python install
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Production settings pass deploy checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          ALLOWED_HOSTS: gymtrainer.onrender.com
          SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py collectstatic --noinput
      - name: Unit tests
        run: pytest tests/unit
      - name: Start MinIO (stands in for Cloudflare R2's form-video bucket)
        run: |
          docker run -d --name storage -p 9000:9000 \
            -e MINIO_ROOT_USER=gymtrainer -e MINIO_ROOT_PASSWORD=gymtrainer-local-only \
            cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1 server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
          python manage.py storage_setup
      - name: Install Playwright browser
        run: playwright install --with-deps chromium
      - name: End-to-end tests
        run: pytest tests/e2e
