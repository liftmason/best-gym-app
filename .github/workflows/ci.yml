name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gymtrainer
          POSTGRES_USER: gymtrainer
          POSTGRES_PASSWORD: gymtrainer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gymtrainer"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://gymtrainer:gymtrainer@localhost:5432/gymtrainer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python and the locked dependencies
        run: |
          uv python install
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: No known vulnerabilities in the locked dependencies
        run: |
          uv export --locked --no-emit-project -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip --require-hashes
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Production settings pass deploy checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          ALLOWED_HOSTS: gymtrainer.onrender.com
          SITE_URL: https://gymtrainer.onrender.com
          EMAIL_PROVIDER: console
          PUSH_PROVIDER: console
          SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py collectstatic --noinput
      - name: Unit tests
        run: pytest tests/unit

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the locked packages
        run: npm ci
      - name: The API types match backend/openapi.json
        run: npm run api:types && git diff --exit-code src/api/schema.d.ts
      - name: The local database matches shared/sync-schema.json
        run: npm run db:schema && git diff --exit-code src/db/schema.generated.ts
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npx jest --ci

  # The coach's web flows end to end (app/e2e): the backend with the demo gym, the web
  # export, and Playwright driving Chromium through them.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gymtrainer
          POSTGRES_USER: gymtrainer
          POSTGRES_PASSWORD: gymtrainer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gymtrainer"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://gymtrainer:gymtrainer@localhost:5432/gymtrainer
      EMAIL_PROVIDER: console
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: The backend with the demo gym, on :8000
        working-directory: backend
        run: |
          uv python install
          uv sync --locked
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_demo --reset
          nohup uv run python manage.py runserver 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:8000/healthz && break; sleep 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: The web app, on :8082
        working-directory: app
        run: |
          npm ci
          npx expo export --platform web
          nohup node scripts/serve-web.mjs > /tmp/web.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:8082/ > /dev/null && break; sleep 1; done
      - name: Playwright
        working-directory: app
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: The report and logs, when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            app/playwright-report
            app/test-results
            /tmp/backend.log
            /tmp/web.log
