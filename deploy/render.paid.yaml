# Render blueprint for real use (paid plans). To switch from the free trial, copy this over
# render.yaml at the repo root; docs/OPERATIONS.md, "Moving to paid", has the steps.
# See docs/BUILD_PLAN.md, "Render deployment".
# The web service and the cron job share one env var group plus DATABASE_URL,
# so the nightly job has the same settings and database as the site.
# ALLOWED_HOSTS is optional: production settings always allow RENDER_EXTERNAL_HOSTNAME.
# Add ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS in the dashboard when a custom domain is added.

envVarGroups:
  - name: gymtrainer-shared
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      # Error reporting: the DSN of a Sentry project (blank leaves it off).
      - key: SENTRY_DSN
        sync: false
      # The web app's address(es), comma-separated, allowed to call the API from a browser.
      - key: WEB_APP_ORIGINS
        sync: false
      # The App Store / Play review account's fixed sign-in code (six digits); blank: none.
      - key: REVIEW_ACCOUNT_EMAIL
        sync: false
      - key: REVIEW_ACCOUNT_CODE
        sync: false
      # Sign in with Apple / Google: the client ids tokens are issued to (comma-separated).
      - key: APPLE_CLIENT_IDS
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      # Billing: BILLING_ENABLED=1 with the Stripe keys; off until plans and prices are set.
      - key: BILLING_ENABLED
        sync: false
      - key: DEFAULT_PLAN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.14.7

services:
  - type: web
    name: gymtrainer
    runtime: python
    rootDir: backend
    plan: starter
    branch: main
    buildCommand: pip install uv && uv export --locked --no-dev --no-hashes -o /tmp/requirements.txt && pip install -r /tmp/requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput && python manage.py ensure_admin
    startCommand: gunicorn config.wsgi:application --workers 3 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - fromGroup: gymtrainer-shared
      - key: DATABASE_URL
        fromDatabase:
          name: gymtrainer-db
          property: connectionString
      # The Django admin's address: something not guessable, e.g. manage-7f3k2/ (with the slash).
      - key: ADMIN_PATH
        sync: false
      # The admin account (bug reports are read in the admin), created or updated on deploy.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Email for invites, reminders and the digest. Set these in the Render dashboard:
      # resend or postmark with its key (production won't start without EMAIL_PROVIDER).
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Form videos: a Cloudflare R2 bucket (docs/OPERATIONS.md). Without them uploads are off.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET
        sync: false

  # Hourly: alerts, form-video clean-up, and each gym's 7am digest (manage.py cron).
  - type: cron
    name: gymtrainer-cron
    runtime: python
    rootDir: backend
    plan: starter
    branch: main
    schedule: "0 * * * *"
    buildCommand: pip install uv && uv export --locked --no-dev --no-hashes -o /tmp/requirements.txt && pip install -r /tmp/requirements.txt
    startCommand: python manage.py cron
    envVars:
      - fromGroup: gymtrainer-shared
      - key: DATABASE_URL
        fromDatabase:
          name: gymtrainer-db
          property: connectionString
      # The digest's links and sending, and video clean-up, need these too.
      - key: SITE_URL
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET
        sync: false

databases:
  - name: gymtrainer-db
    databaseName: gymtrainer
    user: gymtrainer
    postgresMajorVersion: "16"
