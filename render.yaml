# Render blueprint (docs/LAUNCH.md, "The backend (Render)"): the API and Postgres, in
# Virginia (docs/EXPO_MIGRATION.md, decision log). Nothing deploys until the owner
# connects this repository as a Blueprint in their Render account.
#
# The free test run (docs/plans/S8B_TEST_RUN.md). Going public reverses these, in one commit:
# - the web service is `plan: free`: migrations run in the start command (free services have
#   no pre-deploy step), with 2 workers for 512 MB and a 120-second timeout, because the hourly
#   jobs run inside one request. Paid: `plan: starter`, `preDeployCommand: python manage.py
#   migrate --noinput && python manage.py ensure_admin`, 3 workers, the default timeout;
# - the database is `plan: free`, deleted 30 days after it's created unless upgraded.
#   Paid: `plan: basic-256mb` (upgrading keeps the data);
# - there's no cron service (Render has none free): .github/workflows/cron.yml calls
#   /api/v1/ops/cron hourly with CRON_TOKEN. Paid: the `gymtrainer-cron` service (git history,
#   docs/plans/S8B_TEST_RUN.md section 5) and CRON_TOKEN removed;
# - the web app is a free static site here (`gymtrainer-web`) on Render's own address, and
#   the API keeps sign-ins for a week (ACCESS_TOKEN_TTL_MINUTES) with a shared code
#   (TEST_SIGNIN_CODE) instead of emailed ones. Going public: the web app moves to
#   app.liftmason.com, both settings are removed, and email goes through Resend.
# The settings shared with that cron service stay in one env var group, ready for it.
# Every variable the backend reads is listed here (backend/tests/unit/test_render_blueprint.py).

envVarGroups:
  - name: gymtrainer-shared
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      # Error reporting: the DSN of a Sentry project (blank leaves it off).
      - key: SENTRY_DSN
        sync: false
      # The web app's address(es), comma-separated, allowed to call the API from a browser:
      # https://app.liftmason.com. Keep the app and the API on one domain (app. and api.):
      # the web app's sign-in cookie is SameSite=Lax.
      - key: WEB_APP_ORIGINS
        sync: false
      # The web app's address, for links in emails (invites, the digest): https://app.liftmason.com.
      - key: SITE_URL
        sync: false
      # The product's name in emails and the API (blank: Liftmason).
      - key: APP_NAME
        sync: false
      # The App Store / Play review account's fixed sign-in code (six digits); blank: none.
      - key: REVIEW_ACCOUNT_EMAIL
        sync: false
      - key: REVIEW_ACCOUNT_CODE
        sync: false
      # Sign in with Apple / Google: the client ids tokens are issued to (comma-separated).
      - key: APPLE_CLIENT_IDS
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      # Billing: BILLING_ENABLED=1 with the Stripe keys; off until plans and prices are set.
      - key: BILLING_ENABLED
        sync: false
      - key: DEFAULT_PLAN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.14.7

services:
  - type: web
    name: gymtrainer
    runtime: python
    region: virginia
    rootDir: backend
    plan: free
    branch: main
    buildCommand: pip install uv && uv export --locked --no-dev --no-hashes -o /tmp/requirements.txt && pip install -r /tmp/requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py ensure_admin && gunicorn config.wsgi:application --workers 2 --timeout 120 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - fromGroup: gymtrainer-shared
      - key: DATABASE_URL
        fromDatabase:
          name: gymtrainer-db
          property: connectionString
      # The API's own address once its custom domain is added: api.liftmason.com and
      # https://api.liftmason.com (Render's own onrender.com address is always allowed).
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # Set to 1 for the first day after launch, to check which address header Render's
      # proxy sets (docs/LAUNCH.md, "After the first deploy"); then remove it.
      - key: LOG_CLIENT_IP
        sync: false
      # Render's edge (Cloudflare) names the visitor here and overwrites any value a client
      # sends; X-Forwarded-For's last entry is Render's own address (audit M24, checked live).
      - key: CLIENT_IP_HEADER
        value: Cf-Connecting-Ip
      # The free test run's hourly jobs: a long random value, the same as the GitHub
      # repository secret CRON_TOKEN (.github/workflows/cron.yml). Blank once the cron job runs.
      - key: CRON_TOKEN
        sync: false
      # The free test run's sign-in (docs/plans/S8B_TEST_RUN.md): one shared six-digit code for
      # everyone while there's no sending domain, and access tokens that last a week, because
      # the web app is on a different site and can't refresh through its cookie. Remove both
      # when going public.
      - key: TEST_SIGNIN_CODE
        sync: false
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "10080"
      # The Django admin's address: something not guessable, e.g. manage-7f3k2/ (with the slash).
      - key: ADMIN_PATH
        sync: false
      # The admin account (bug reports are read in the admin), created or updated on deploy.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Email for invites, reminders and the digest. Set these in the Render dashboard:
      # resend or postmark with its key (production won't start without EMAIL_PROVIDER).
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Push notifications through Expo (production won't start without PUSH_PROVIDER).
      - key: PUSH_PROVIDER
        value: expo
      # Only if the Expo project turns on "enhanced push security".
      - key: EXPO_ACCESS_TOKEN
        sync: false
      # Form videos: a Cloudflare R2 bucket (docs/OPERATIONS.md). Without them uploads are off.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET
        sync: false
      - key: STORAGE_REGION
        value: auto

  # The web app, for the free test run: the Expo web export on Render's CDN, with the headers
  # from app/public/_headers (the local database needs cross-origin isolation). Its address
  # goes in the API's SITE_URL and WEB_APP_ORIGINS; the API's address is EXPO_PUBLIC_API_URL below.
  - type: web
    name: gymtrainer-web
    runtime: static
    branch: main
    buildCommand: cd app && npm ci && node scripts/check-api-url.mjs && npx expo export --platform web
    staticPublishPath: app/dist
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API's public address, built into the app. Written out here because Render's
      # fromService only gives the private hostname, and a value typed into the dashboard
      # shipped a broken first build; scripts/check-api-url.mjs now fails a malformed one.
      # Render named the API gymtrainer-kqrl; this becomes https://api.liftmason.com in Part 1b.
      - key: EXPO_PUBLIC_API_URL
        value: https://gymtrainer-kqrl.onrender.com
      - key: EXPO_PUBLIC_SENTRY_DSN
        sync: false
      # Keep the access token across reloads (app/src/api/tokens.ts): the cookie can't cross
      # from this site to the API's. Remove when the app and the API share liftmason.com.
      - key: EXPO_PUBLIC_WEB_REMEMBER_SIGN_IN
        value: "1"

databases:
  - name: gymtrainer-db
    region: virginia
    plan: free
    databaseName: gymtrainer
    user: gymtrainer
    postgresMajorVersion: "16"
