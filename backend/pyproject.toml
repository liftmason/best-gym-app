[project]
name = "gymtrainer"
version = "0.1.0"
requires-python = ">=3.14"
# Exact versions are pinned in uv.lock; install with `uv sync` (CI: `uv sync --locked`).
dependencies = [
    "Django>=5.2.8,<5.3",  # 5.2.8 is the first 5.2 release that supports Python 3.14
    "dj-database-url>=2.3",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.9",
    "gunicorn>=23.0",
    "django-anymail>=13.0",
    "boto3>=1.35",
    "sentry-sdk[django]>=2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.10",
    "time-machine>=2.16",
    "factory-boy>=3.3",
    "ruff==0.16.9",  # same version as .pre-commit-config.yaml
    "pre-commit>=4.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["mockup", "static", "staticfiles", "**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["ignore:No directory at:UserWarning"]
